<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSD1306 OLED Pixel Editor — 128×32</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
  h1 { font-size: 16px; padding: 12px 16px 0; color: #7ec8e3; }
  .subtitle { font-size: 11px; padding: 2px 16px 10px; color: #666; }
  .main { display: flex; gap: 16px; padding: 0 16px 16px; flex-wrap: wrap; }
  .left { flex: 1; min-width: 780px; }
  .right { width: 320px; display: flex; flex-direction: column; gap: 12px; }

  /* Grid canvas */
  .grid-wrap { position: relative; background: #000; border: 1px solid #333; display: inline-block; cursor: crosshair; }
  #gridCanvas { display: block; image-rendering: pixelated; }

  /* Toolbar */
  .toolbar { display: flex; gap: 6px; padding: 8px 0; align-items: center; flex-wrap: wrap; }
  .toolbar button, .toolbar label { font-size: 12px; padding: 4px 10px; border: 1px solid #444; background: #2a2a3e; color: #ccc; border-radius: 3px; cursor: pointer; user-select: none; }
  .toolbar button:hover, .toolbar label:hover { background: #3a3a5e; }
  .toolbar button.active { background: #4a6fa5; color: #fff; border-color: #6a8fc5; }
  .toolbar .sep { width: 1px; height: 20px; background: #444; }

  /* Preview */
  .panel { background: #111; border: 1px solid #333; border-radius: 4px; padding: 10px; }
  .panel h2 { font-size: 12px; color: #7ec8e3; margin-bottom: 8px; }
  .preview-actual { background: #000; border: 1px solid #222; display: inline-block; image-rendering: pixelated; }
  .preview-scaled { background: #000; border: 1px solid #222; display: inline-block; image-rendering: pixelated; margin-top: 6px; }

  /* Export */
  .export-area { width: 100%; height: 260px; background: #0d0d1a; color: #a0d2a0; font-family: "SF Mono", "Fira Code", "Consolas", monospace; font-size: 11px; border: 1px solid #333; border-radius: 3px; padding: 8px; resize: vertical; tab-size: 2; }
  .btn-row { display: flex; gap: 6px; margin-top: 6px; }
  .btn-row button { font-size: 11px; padding: 4px 10px; border: 1px solid #444; background: #2a2a3e; color: #ccc; border-radius: 3px; cursor: pointer; }
  .btn-row button:hover { background: #3a3a5e; }
  .btn-row button.primary { background: #4a6fa5; color: #fff; border-color: #6a8fc5; }

  /* Import */
  .import-area { width: 100%; height: 80px; background: #0d0d1a; color: #ccc; font-family: monospace; font-size: 11px; border: 1px solid #333; border-radius: 3px; padding: 8px; resize: vertical; }

  /* Coordinates */
  .coords { font-size: 11px; color: #666; padding: 2px 0; min-height: 16px; }

  /* Frame navigator */
  .frame-nav { display: flex; gap: 6px; padding: 8px 0; align-items: center; background: #111; border: 1px solid #333; border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; }
  .frame-nav button { font-size: 14px; padding: 2px 10px; border: 1px solid #444; background: #2a2a3e; color: #ccc; border-radius: 3px; cursor: pointer; font-weight: bold; }
  .frame-nav button:hover { background: #3a3a5e; }
  .frame-nav button:disabled { opacity: 0.3; cursor: default; }
  .frame-nav .frame-label { font-size: 12px; color: #7ec8e3; margin: 0 4px; white-space: nowrap; }
  .frame-nav .frame-indicator { font-size: 11px; color: #888; margin-left: auto; }
  .frame-nav .copy-group { display: flex; gap: 4px; align-items: center; margin-left: 12px; padding-left: 10px; border-left: 1px solid #333; }
  .frame-nav .copy-group label { font-size: 11px; color: #888; }
  .frame-nav .copy-group select { font-size: 11px; padding: 2px 4px; background: #1a1a2e; color: #ccc; border: 1px solid #444; border-radius: 3px; }
  .frame-nav .copy-group button { font-size: 11px; padding: 2px 8px; }

  /* Animation preview */
  .anim-controls { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .anim-controls button { font-size: 12px; padding: 4px 12px; border: 1px solid #444; background: #2a2a3e; color: #ccc; border-radius: 3px; cursor: pointer; }
  .anim-controls button:hover { background: #3a3a5e; }
  .anim-controls button.playing { background: #8b3a3a; color: #fff; border-color: #c55; }
  .anim-controls .frame-counter { font-size: 11px; color: #666; min-width: 50px; }
</style>
</head>
<body>

<h1>SSD1306 OLED Pixel Editor</h1>
<p class="subtitle">128×32 pixels &middot; Page-major format &middot; 30-frame animation editor &middot; anim_frames compatible export</p>

<div class="main">
  <div class="left">
    <div class="frame-nav">
      <button id="btnPrevFrame" title="Previous frame (Left arrow)">&laquo;</button>
      <span class="frame-label">Frame <span id="frameNum">1</span> / <span id="frameTotal">30</span></span>
      <button id="btnNextFrame" title="Next frame (Right arrow)">&raquo;</button>
      <span class="frame-indicator"><span id="frameDirty"></span></span>
      <div class="copy-group">
        <label for="copySrc">Copy from:</label>
        <select id="copySrc"></select>
        <button id="btnCopyFrame" title="Copy selected frame into current frame">Copy</button>
      </div>
    </div>
    <div class="grid-wrap" id="gridWrap">
      <canvas id="gridCanvas" width="768" height="192"></canvas>
    </div>
    <div class="coords" id="coords">&nbsp;</div>
    <div class="toolbar">
      <button id="toolDraw" class="active" title="Draw (D)">Draw</button>
      <button id="toolErase" title="Erase (E)">Erase</button>
      <button id="toolFill" title="Fill rectangular area (F)">Fill</button>
      <div class="sep"></div>
      <button id="btnClear" title="Clear all pixels">Clear</button>
      <button id="btnInvert" title="Invert all pixels">Invert</button>
      <div class="sep"></div>
      <label title="Toggle grid lines"><input type="checkbox" id="chkGrid" checked> Grid</label>
      <label title="Show page boundaries every 8 rows"><input type="checkbox" id="chkPages" checked> Pages</label>
    </div>
  </div>

  <div class="right">
    <!-- Preview -->
    <div class="panel">
      <h2>Preview (actual size 128×32)</h2>
      <canvas class="preview-actual" id="previewActual" width="128" height="32"></canvas>
      <h2 style="margin-top:8px">Preview (4× scale)</h2>
      <canvas class="preview-scaled" id="previewScaled" width="512" height="128"></canvas>
      <div class="anim-controls">
        <button id="btnPlayAnim" title="Play/stop animation preview">▶ Play</button>
        <span class="frame-counter" id="animFrameCounter"></span>
      </div>
    </div>

    <!-- Export -->
    <div class="panel">
      <h2>C Code Export</h2>
      <textarea class="export-area" id="exportArea" readonly></textarea>
      <div class="btn-row">
        <button class="primary" id="btnExport">Generate</button>
        <button id="btnCopy">Copy to clipboard</button>
        <button id="btnDownload">Download .c</button>
      </div>
    </div>

    <!-- Import -->
    <div class="panel">
      <h2>Import from C Code</h2>
      <textarea class="import-area" id="importArea" placeholder="Paste hex values from logofont.c..."></textarea>
      <div class="btn-row">
        <button id="btnImport">Import</button>
        <button id="btnImportLogo">Load Keyball Logo</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ── Constants ──
  const W = 128, H = 32, PAGES = 4, PAGE_H = 8;
  const PX = 5, BORDER = 1, CELL = PX + BORDER;
  const CHAR_W = 6, CHARS_PER_PAGE = 16;
  const FRAME_COUNT = 30, FRAME_SIZE = 288, ANIM_COLS = 96, ANIM_PAGES = 3;

  // ── State ──
  const buf = new Uint8Array(W * PAGES); // 512 bytes, page-major: buf[page*128 + x]
  const frames = Array.from({length: FRAME_COUNT}, () => new Uint8Array(FRAME_SIZE));
  let currentFrame = 0;
  let animPlaying = false;
  let animTimer = null;
  let animPreviewIdx = 0;
  let tool = "draw";
  let drawing = false;
  let drawVal = 1;
  let fillStart = null;

  // ── DOM ──
  const gridCanvas = document.getElementById("gridCanvas");
  const gridCtx = gridCanvas.getContext("2d");
  const previewActual = document.getElementById("previewActual");
  const previewScaled = document.getElementById("previewScaled");
  const ctxActual = previewActual.getContext("2d");
  const ctxScaled = previewScaled.getContext("2d");
  const exportArea = document.getElementById("exportArea");
  const importArea = document.getElementById("importArea");
  const coordsEl = document.getElementById("coords");
  const frameNumEl = document.getElementById("frameNum");
  const frameTotalEl = document.getElementById("frameTotal");
  const frameDirtyEl = document.getElementById("frameDirty");
  const btnPrevFrame = document.getElementById("btnPrevFrame");
  const btnNextFrame = document.getElementById("btnNextFrame");
  const btnPlayAnim = document.getElementById("btnPlayAnim");
  const animFrameCounter = document.getElementById("animFrameCounter");
  const copySrcSelect = document.getElementById("copySrc");
  const btnCopyFrame = document.getElementById("btnCopyFrame");

  // ── Buffer helpers ──
  function getPixel(x, y) {
    const page = (y / PAGE_H) | 0;
    const bit = y & 7;
    return (buf[page * W + x] >> bit) & 1;
  }

  function setPixel(x, y, val) {
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    const page = (y / PAGE_H) | 0;
    const bit = y & 7;
    const off = page * W + x;
    if (val) buf[off] |= (1 << bit);
    else     buf[off] &= ~(1 << bit);
  }

  function clearBuf() { buf.fill(0); }
  function invertBuf() { for (let i = 0; i < buf.length; i++) buf[i] ^= 0xFF; }

  // ── Frame management ──
  function saveCurrentFrame() {
    let idx = 0;
    for (let page = 0; page < ANIM_PAGES; page++) {
      for (let col = 0; col < ANIM_COLS; col++) {
        frames[currentFrame][idx++] = buf[page * W + col];
      }
    }
  }

  function loadCurrentFrame() {
    let idx = 0;
    for (let page = 0; page < ANIM_PAGES; page++) {
      for (let col = 0; col < ANIM_COLS; col++) {
        buf[page * W + col] = frames[currentFrame][idx++];
      }
      for (let col = ANIM_COLS; col < W; col++) {
        buf[page * W + col] = 0;
      }
    }
    buf.fill(0, ANIM_PAGES * W);
  }

  function updateFrameUI() {
    frameNumEl.textContent = currentFrame + 1;
    btnPrevFrame.disabled = currentFrame === 0;
    btnNextFrame.disabled = currentFrame === FRAME_COUNT - 1;
  }

  function switchFrame(newFrame) {
    if (newFrame < 0 || newFrame >= FRAME_COUNT || newFrame === currentFrame) return;
    saveCurrentFrame();
    currentFrame = newFrame;
    loadCurrentFrame();
    updateFrameUI();
    render();
  }

  // ── Grid rendering ──
  let showGrid = true, showPages = true;

  function drawGrid() {
    const cw = gridCanvas.width, ch = gridCanvas.height;
    gridCtx.fillStyle = "#000";
    gridCtx.fillRect(0, 0, cw, ch);

    // Draw pixels
    for (let py = 0; py < H; py++) {
      for (let px = 0; px < W; px++) {
        if (getPixel(px, py)) {
          gridCtx.fillStyle = "#fff";
          gridCtx.fillRect(px * CELL, py * CELL, PX, PX);
        }
      }
    }

    if (!showGrid && !showPages) return;

    // Grid lines
    if (showGrid) {
      gridCtx.strokeStyle = "rgba(255,255,255,0.06)";
      gridCtx.lineWidth = 0.5;
      gridCtx.beginPath();
      for (let x = 0; x <= W; x++) {
        const sx = x * CELL;
        gridCtx.moveTo(sx, 0); gridCtx.lineTo(sx, ch);
      }
      for (let y = 0; y <= H; y++) {
        const sy = y * CELL;
        gridCtx.moveTo(0, sy); gridCtx.lineTo(cw, sy);
      }
      gridCtx.stroke();
    }

    // Page boundaries (every 8 rows) and character boundaries (every 6 cols)
    if (showPages) {
      gridCtx.strokeStyle = "rgba(100,160,255,0.2)";
      gridCtx.lineWidth = 1;
      gridCtx.beginPath();
      for (let p = 1; p < PAGES; p++) {
        const sy = p * PAGE_H * CELL - 0.5;
        gridCtx.moveTo(0, sy); gridCtx.lineTo(cw, sy);
      }
      gridCtx.stroke();

      // Char column boundaries
      gridCtx.strokeStyle = "rgba(100,160,255,0.08)";
      gridCtx.lineWidth = 0.5;
      gridCtx.beginPath();
      for (let c = 1; c < CHARS_PER_PAGE; c++) {
        const sx = c * CHAR_W * CELL - 0.5;
        gridCtx.moveTo(sx, 0); gridCtx.lineTo(sx, ch);
      }
      gridCtx.stroke();
    }
  }

  // ── Preview rendering ──
  function drawPreview() {
    // Actual size
    const imgData = ctxActual.createImageData(W, H);
    for (let py = 0; py < H; py++) {
      for (let px = 0; px < W; px++) {
        const idx = (py * W + px) * 4;
        const on = getPixel(px, py);
        imgData.data[idx] = on ? 255 : 0;
        imgData.data[idx+1] = on ? 255 : 0;
        imgData.data[idx+2] = on ? 255 : 0;
        imgData.data[idx+3] = 255;
      }
    }
    ctxActual.putImageData(imgData, 0, 0);

    // 4× scaled
    ctxScaled.imageSmoothingEnabled = false;
    ctxScaled.clearRect(0, 0, 512, 128);
    ctxScaled.drawImage(previewActual, 0, 0, 512, 128);
  }

  function render() {
    drawGrid();
    drawPreview();
  }

  // ── Animation preview rendering ──
  function renderFrameToPreview(frameIdx) {
    const frameData = frames[frameIdx];
    const imgData = ctxActual.createImageData(W, H);
    for (let py = 0; py < H; py++) {
      for (let px = 0; px < W; px++) {
        const idx4 = (py * W + px) * 4;
        let on = 0;
        if (py < ANIM_PAGES * PAGE_H && px < ANIM_COLS) {
          const page = (py / PAGE_H) | 0;
          const bit = py & 7;
          on = (frameData[page * ANIM_COLS + px] >> bit) & 1;
        }
        imgData.data[idx4] = on ? 255 : 0;
        imgData.data[idx4+1] = on ? 255 : 0;
        imgData.data[idx4+2] = on ? 255 : 0;
        imgData.data[idx4+3] = 255;
      }
    }
    ctxActual.putImageData(imgData, 0, 0);
    ctxScaled.imageSmoothingEnabled = false;
    ctxScaled.clearRect(0, 0, 512, 128);
    ctxScaled.drawImage(previewActual, 0, 0, 512, 128);
  }

  function startAnimPreview() {
    if (animPlaying) return;
    animPlaying = true;
    animPreviewIdx = 0;
    btnPlayAnim.textContent = "■ Stop";
    btnPlayAnim.classList.add("playing");
    animFrameCounter.textContent = "1 / " + FRAME_COUNT;
    renderFrameToPreview(0);
    animTimer = setInterval(function() {
      animPreviewIdx = (animPreviewIdx + 1) % FRAME_COUNT;
      renderFrameToPreview(animPreviewIdx);
      animFrameCounter.textContent = (animPreviewIdx + 1) + " / " + FRAME_COUNT;
    }, 150);
  }

  function stopAnimPreview() {
    animPlaying = false;
    if (animTimer) { clearInterval(animTimer); animTimer = null; }
    btnPlayAnim.textContent = "▶ Play";
    btnPlayAnim.classList.remove("playing");
    animFrameCounter.textContent = "";
    drawPreview();
  }

  // ── Coordinate mapping ──
  function canvasToPixel(e) {
    const rect = gridCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const px = (mx / CELL) | 0;
    const py = (my / CELL) | 0;
    if (px < 0 || px >= W || py < 0 || py >= H) return null;
    return { x: px, y: py };
  }

  // ── Mouse interaction ──
  let lastPixel = null;

  gridCanvas.addEventListener("mousedown", function(e) {
    e.preventDefault();
    const p = canvasToPixel(e);
    if (!p) return;

    if (tool === "fill") {
      if (!fillStart) {
        fillStart = p;
        coordsEl.textContent = `Fill start: (${p.x}, ${p.y}) — click again to set end`;
      } else {
        const x0 = Math.min(fillStart.x, p.x), x1 = Math.max(fillStart.x, p.x);
        const y0 = Math.min(fillStart.y, p.y), y1 = Math.max(fillStart.y, p.y);
        for (let y = y0; y <= y1; y++)
          for (let x = x0; x <= x1; x++)
            setPixel(x, y, 1);
        fillStart = null;
        render();
        coordsEl.textContent = `Filled (${x0},${y0}) to (${x1},${y1})`;
      }
      return;
    }

    drawing = true;
    drawVal = (tool === "erase") ? 0 : 1;
    setPixel(p.x, p.y, drawVal);
    lastPixel = p;
    render();
  });

  gridCanvas.addEventListener("mousemove", function(e) {
    const p = canvasToPixel(e);
    if (p) {
      coordsEl.textContent = `x: ${p.x}, y: ${p.y}  page: ${(p.y / PAGE_H) | 0}, bit: ${p.y & 7}`;
    } else {
      coordsEl.textContent = "\u00a0";
    }
    if (!drawing || !p) return;
    // Bresenham-ish interpolation for fast drag
    if (lastPixel) {
      let dx = p.x - lastPixel.x, dy = p.y - lastPixel.y;
      const steps = Math.max(Math.abs(dx), Math.abs(dy));
      if (steps > 0) {
        for (let i = 0; i <= steps; i++) {
          const ix = lastPixel.x + (dx * i / steps) | 0;
          const iy = lastPixel.y + (dy * i / steps) | 0;
          setPixel(ix, iy, drawVal);
        }
      }
    } else {
      setPixel(p.x, p.y, drawVal);
    }
    lastPixel = p;
    render();
  });

  window.addEventListener("mouseup", function() {
    drawing = false;
    lastPixel = null;
  });

  // Prevent context menu on canvas
  gridCanvas.addEventListener("contextmenu", function(e) { e.preventDefault(); });

  // ── Keyboard shortcuts ──
  document.addEventListener("keydown", function(e) {
    if (e.target.tagName === "TEXTAREA") return;
    switch(e.key.toLowerCase()) {
      case "d": selectTool("draw"); break;
      case "e": selectTool("erase"); break;
      case "f": selectTool("fill"); break;
      case "arrowleft": switchFrame(currentFrame - 1); e.preventDefault(); break;
      case "arrowright": switchFrame(currentFrame + 1); e.preventDefault(); break;
      case " ": if (animPlaying) stopAnimPreview(); else startAnimPreview(); e.preventDefault(); break;
    }
  });

  // ── Tool selection ──
  function selectTool(t) {
    tool = t;
    fillStart = null;
    document.getElementById("toolDraw").classList.toggle("active", t === "draw");
    document.getElementById("toolErase").classList.toggle("active", t === "erase");
    document.getElementById("toolFill").classList.toggle("active", t === "fill");
    if (t !== "fill") coordsEl.textContent = "\u00a0";
  }

  document.getElementById("toolDraw").addEventListener("click", function() { selectTool("draw"); });
  document.getElementById("toolErase").addEventListener("click", function() { selectTool("erase"); });
  document.getElementById("toolFill").addEventListener("click", function() { selectTool("fill"); });

  // ── Buttons ──
  document.getElementById("btnClear").addEventListener("click", function() { clearBuf(); render(); });
  document.getElementById("btnInvert").addEventListener("click", function() { invertBuf(); render(); });

  document.getElementById("chkGrid").addEventListener("change", function() {
    showGrid = this.checked; render();
  });
  document.getElementById("chkPages").addEventListener("change", function() {
    showPages = this.checked; render();
  });

  // ── Frame navigation ──
  btnPrevFrame.addEventListener("click", function() { switchFrame(currentFrame - 1); });
  btnNextFrame.addEventListener("click", function() { switchFrame(currentFrame + 1); });
  btnPlayAnim.addEventListener("click", function() {
    if (animPlaying) stopAnimPreview(); else startAnimPreview();
  });
  btnCopyFrame.addEventListener("click", function() {
    const src = parseInt(copySrcSelect.value, 10);
    if (src === currentFrame) return;
    saveCurrentFrame();
    frames[currentFrame].set(frames[src]);
    loadCurrentFrame();
    render();
  });

  // ── Export ──
  function generateFrameCCode(frameData, frameIdx) {
    let lines = [];
    lines.push("  // Frame " + frameIdx);
    lines.push("  {");
    let idx = 0;
    for (let row = 0; row < 12; row++) {
      let vals = [];
      for (let c = 0; c < 24; c++) {
        vals.push("0x" + frameData[idx++].toString(16).toUpperCase().padStart(2, "0"));
      }
      lines.push("    " + vals.join(",") + ",");
    }
    lines.push("  }");
    return lines.join("\n");
  }

  function generateCCode() {
    saveCurrentFrame();
    let lines = [];
    lines.push("// Generated with SSD1306 OLED Pixel Editor — Animation Mode");
    lines.push("// 128x32 pixels, " + FRAME_COUNT + " frames x " + FRAME_SIZE + " bytes");
    lines.push("");
    lines.push("#define ANIM_FRAME_COUNT " + FRAME_COUNT);
    lines.push("#define ANIM_FRAME_SIZE  " + FRAME_SIZE);
    lines.push("");
    lines.push("const uint8_t anim_frames[ANIM_FRAME_COUNT][ANIM_FRAME_SIZE] PROGMEM = {");
    for (let f = 0; f < FRAME_COUNT; f++) {
      lines.push(generateFrameCCode(frames[f], f));
      if (f < FRAME_COUNT - 1) lines.push(",");
    }
    lines.push("};");
    return lines.join("\n");
  }

  document.getElementById("btnExport").addEventListener("click", function() {
    exportArea.value = generateCCode();
  });

  document.getElementById("btnCopy").addEventListener("click", function() {
    if (!exportArea.value) exportArea.value = generateCCode();
    navigator.clipboard.writeText(exportArea.value).then(function() {
      const btn = document.getElementById("btnCopy");
      const orig = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(function() { btn.textContent = orig; }, 1200);
    });
  });

  document.getElementById("btnDownload").addEventListener("click", function() {
    const code = exportArea.value || generateCCode();
    const blob = new Blob([code], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "anim_frames.c";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // ── Import ──
  function parseCValues(text) {
    const matches = text.match(/0x[0-9a-fA-F]{1,2}/g);
    if (!matches) return null;
    return matches.map(function(s) { return parseInt(s, 16); });
  }

  function isAnimArray(text) {
    return /anim_frames\s*\[/.test(text) || /ANIM_FRAME_COUNT/.test(text);
  }

  function importAnimArray(text) {
    const values = parseCValues(text);
    if (!values) return 0;
    const expectedTotal = FRAME_COUNT * FRAME_SIZE;
    if (values.length < expectedTotal) {
      alert("Expected " + expectedTotal + " hex values for " + FRAME_COUNT + " frames, got " + values.length);
      return 0;
    }
    for (let f = 0; f < FRAME_COUNT; f++) {
      for (let i = 0; i < FRAME_SIZE; i++) {
        frames[f][i] = values[f * FRAME_SIZE + i];
      }
    }
    return FRAME_COUNT;
  }

  function importSingleFrame(text) {
    const values = parseCValues(text);
    if (!values || values.length < FRAME_SIZE) {
      alert("Could not parse enough hex values. Need " + FRAME_SIZE + " (1 frame), got " + (values ? values.length : 0));
      return false;
    }
    for (let i = 0; i < FRAME_SIZE; i++) {
      frames[currentFrame][i] = values[i];
    }
    return true;
  }

  document.getElementById("btnImport").addEventListener("click", function() {
    const text = importArea.value;
    if (!text.trim()) return;
    if (isAnimArray(text)) {
      const count = importAnimArray(text);
      if (count > 0) {
        currentFrame = 0;
        loadCurrentFrame();
        updateFrameUI();
        render();
        alert("Imported " + count + " frames.");
      }
    } else {
      if (importSingleFrame(text)) {
        loadCurrentFrame();
        render();
      }
    }
  });

  function loadFromValues(values) {
    for (let i = 0; i < FRAME_SIZE && i < values.length; i++) {
      frames[currentFrame][i] = values[i];
    }
    loadCurrentFrame();
  }
